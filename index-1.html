<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Aurora Themes</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body, html {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
  }

  canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }

  /* ── Button Group ── */
  .btn-group {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 100;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 50px;
    padding: 6px;
  }

  .btn {
    position: relative;
    padding: 10px 22px;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.3px;
    color: rgba(255,255,255,0.55);
    background: transparent;
    transition: color 0.3s ease;
    white-space: nowrap;
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 40px;
    background: rgba(255,255,255,0.12);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .btn:hover::before { opacity: 1; }
  .btn:hover { color: rgba(255,255,255,0.8); }

  .btn.active {
    color: #fff;
  }

  .btn.active::before {
    opacity: 1;
    background: rgba(255,255,255,0.18);
  }

  /* 动态指示器：跟随激活按钮移动的胶囊 */
  .indicator {
    position: absolute;
    height: calc(100% - 12px);
    top: 6px;
    border-radius: 40px;
    transition: left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                background 0.6s ease;
    pointer-events: none;
    z-index: -1;
  }

  /* 主题名浮层 */
  .theme-label {
    position: fixed;
    top: 36px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.25);
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    pointer-events: none;
    transition: opacity 0.5s;
    user-select: none;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="theme-label" id="label">Monterey</div>

<div class="btn-group" id="btnGroup">
  <div class="indicator" id="indicator"></div>
  <button class="btn active" data-theme="0">Monterey</button>
  <button class="btn" data-theme="1">Ocean Deep</button>
  <button class="btn" data-theme="2">Solar Flare</button>
  <button class="btn" data-theme="3">Northern Lights</button>
  <button class="btn" data-theme="4">Obsidian</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ─────────────────────────────────────────────
// 主题配置
// ─────────────────────────────────────────────
const THEMES = [
  {
    name: 'Monterey',
    bg: ['#0a0018', '#1a0535', '#050010'],
    // 每个 petal 是一片"花瓣光束"
    petals: [
      { colorA: '#9b00ff', colorB: '#2d0060', alpha: 0.85, pivotX: 0.28, pivotY: 1.15 },
      { colorA: '#ff00cc', colorB: '#7700aa', alpha: 0.80, pivotX: 0.42, pivotY: 1.15 },
      { colorA: '#ff40dd', colorB: '#cc00ff', alpha: 0.75, pivotX: 0.52, pivotY: 1.15 },
      { colorA: '#ff80ee', colorB: '#9900cc', alpha: 0.65, pivotX: 0.64, pivotY: 1.15 },
      { colorA: '#dd00ff', colorB: '#440088', alpha: 0.55, pivotX: 0.74, pivotY: 1.15 },
    ],
    blendMode: 'screen',
    petalCount: 7,
    spread: 0.55,
    curvature: 0.45,
    brightness: 1.0,
  },
  {
    name: 'Ocean Deep',
    bg: ['#000d1a', '#001428', '#000810'],
    petals: [
      { colorA: '#00cfff', colorB: '#001866', alpha: 0.80, pivotX: 0.22, pivotY: 1.15 },
      { colorA: '#0088ff', colorB: '#003388', alpha: 0.75, pivotX: 0.36, pivotY: 1.15 },
      { colorA: '#00eeff', colorB: '#006699', alpha: 0.70, pivotX: 0.50, pivotY: 1.15 },
      { colorA: '#44ffdd', colorB: '#009988', alpha: 0.65, pivotX: 0.62, pivotY: 1.15 },
      { colorA: '#0055ff', colorB: '#002266', alpha: 0.55, pivotX: 0.76, pivotY: 1.15 },
    ],
    blendMode: 'screen',
    petalCount: 7,
    spread: 0.52,
    curvature: 0.5,
    brightness: 0.95,
  },
  {
    name: 'Solar Flare',
    bg: ['#120000', '#200a00', '#080000'],
    petals: [
      { colorA: '#ff6600', colorB: '#330000', alpha: 0.85, pivotX: 0.20, pivotY: 1.15 },
      { colorA: '#ffaa00', colorB: '#661100', alpha: 0.80, pivotX: 0.34, pivotY: 1.15 },
      { colorA: '#ff3300', colorB: '#880000', alpha: 0.75, pivotX: 0.48, pivotY: 1.15 },
      { colorA: '#ffdd00', colorB: '#883300', alpha: 0.70, pivotX: 0.60, pivotY: 1.15 },
      { colorA: '#ff0066', colorB: '#440022', alpha: 0.60, pivotX: 0.74, pivotY: 1.15 },
    ],
    blendMode: 'screen',
    petalCount: 7,
    spread: 0.58,
    curvature: 0.42,
    brightness: 1.1,
  },
  {
    name: 'Northern Lights',
    bg: ['#000d08', '#001510', '#000508'],
    petals: [
      { colorA: '#00ff88', colorB: '#003322', alpha: 0.75, pivotX: 0.18, pivotY: 1.15 },
      { colorA: '#00ddff', colorB: '#002244', alpha: 0.70, pivotX: 0.32, pivotY: 1.15 },
      { colorA: '#88ffcc', colorB: '#006644', alpha: 0.65, pivotX: 0.48, pivotY: 1.15 },
      { colorA: '#00ffcc', colorB: '#005544', alpha: 0.70, pivotX: 0.62, pivotY: 1.15 },
      { colorA: '#44ddff', colorB: '#003366', alpha: 0.60, pivotX: 0.76, pivotY: 1.15 },
    ],
    blendMode: 'screen',
    petalCount: 8,
    spread: 0.60,
    curvature: 0.48,
    brightness: 0.9,
  },
  {
    name: 'Obsidian',
    bg: ['#080808', '#111111', '#050505'],
    petals: [
      { colorA: '#8800ff', colorB: '#110022', alpha: 0.70, pivotX: 0.22, pivotY: 1.15 },
      { colorA: '#ffffff', colorB: '#333355', alpha: 0.30, pivotX: 0.38, pivotY: 1.15 },
      { colorA: '#aaaaff', colorB: '#111133', alpha: 0.50, pivotX: 0.52, pivotY: 1.15 },
      { colorA: '#ffffff', colorB: '#222222', alpha: 0.25, pivotX: 0.64, pivotY: 1.15 },
      { colorA: '#6600cc', colorB: '#0a0022', alpha: 0.65, pivotX: 0.76, pivotY: 1.15 },
    ],
    blendMode: 'screen',
    petalCount: 6,
    spread: 0.50,
    curvature: 0.55,
    brightness: 0.85,
  },
];

// ─────────────────────────────────────────────
// 状态管理
// ─────────────────────────────────────────────
let currentThemeIdx = 0;
let targetThemeIdx  = 0;
let transitionProgress = 1; // 0~1，1 表示已完成过渡
let time = 0;

// 用于插值的"当前显示主题"的参数快照
let fromSnapshot = null;
let toSnapshot   = null;

// ─────────────────────────────────────────────
// 生成花瓣参数（基于主题配置派生出完整的花瓣数组）
// ─────────────────────────────────────────────
function generatePetals(theme, t) {
  const W = canvas.width;
  const H = canvas.height;
  const count = theme.petalCount;
  const spread = theme.spread;
  const curvature = theme.curvature;
  const pivotX = 0.5; // 所有花瓣从底部中心点发散
  const pivotY = 1.05;

  const petals = [];

  for (let i = 0; i < count; i++) {
    const norm = i / (count - 1); // 0 ~ 1
    // 每片花瓣对应主题中预设的颜色（循环取色）
    const colorDef = theme.petals[i % theme.petals.length];

    // 花瓣展开角度范围：从左到右
    const angle = (-spread / 2 + norm * spread) * Math.PI;

    // 用正弦波给每片花瓣加上独立的"呼吸"偏移
    // 不同花瓣的 phase 不同，形成有机的波动
    const breathX = Math.sin(t * 0.0004 + norm * 2.8) * 0.05;
    const breathY = Math.cos(t * 0.0003 + norm * 1.9) * 0.06;

    // 花瓣顶端落点（在画布上方之外）
    const tipX = pivotX + Math.sin(angle + breathX * Math.PI) * curvature;
    const tipY = -0.1 + breathY;

    // 贝塞尔控制点（决定花瓣的弯曲程度和"腰身"）
    const cp1x = pivotX + Math.sin(angle * 0.6) * curvature * 0.5;
    const cp1y = pivotY - 0.6;
    const cp2x = tipX - Math.sin(angle) * 0.08;
    const cp2y = tipY + 0.4;

    petals.push({
      colorA:  colorDef.colorA,
      colorB:  colorDef.colorB,
      alpha:   colorDef.alpha,
      // 归一化坐标 → 实际像素（在绘制时计算）
      pivotX: pivotX * W,
      pivotY: pivotY * H,
      tipX:   tipX * W,
      tipY:   tipY * H,
      cp1x:   cp1x * W,
      cp1y:   cp1y * H,
      cp2x:   cp2x * W,
      cp2y:   cp2y * H,
      // 花瓣宽度（左右各一条边）
      widthBase: W * (0.10 + (1 - Math.abs(norm - 0.5) * 2) * 0.08),
      widthTip:  W * 0.01,
    });
  }

  return petals;
}

// ─────────────────────────────────────────────
// 绘制单片花瓣
// ─────────────────────────────────────────────
function drawPetal(petal, blendMode, brightness) {
  const { pivotX, pivotY, tipX, tipY, cp1x, cp1y, cp2x, cp2y,
          colorA, colorB, alpha, widthBase, widthTip } = petal;

  // 计算花瓣"脊线"方向，用于生成花瓣两侧的偏移点
  const dx = tipX - pivotX;
  const dy = tipY - pivotY;
  const len = Math.hypot(dx, dy);
  const nx = -dy / len; // 法线 x
  const ny =  dx / len; // 法线 y

  // 花瓣左侧路径（起点 → 顶端，偏移 -width/2）
  const p0x = pivotX + nx * widthBase * 0.5;
  const p0y = pivotY + ny * widthBase * 0.5;
  const p1x = tipX   + nx * widthTip  * 0.5;
  const p1y = tipY   + ny * widthTip  * 0.5;

  // 花瓣右侧路径（偏移 +width/2，反向）
  const p2x = tipX   - nx * widthTip  * 0.5;
  const p2y = tipY   - ny * widthTip  * 0.5;
  const p3x = pivotX - nx * widthBase * 0.5;
  const p3y = pivotY - ny * widthBase * 0.5;

  // 左侧贝塞尔控制点偏移
  const lcp1x = cp1x + nx * widthBase * 0.35;
  const lcp1y = cp1y + ny * widthBase * 0.35;
  const lcp2x = cp2x + nx * widthTip  * 0.35;
  const lcp2y = cp2y + ny * widthTip  * 0.35;

  // 右侧贝塞尔控制点偏移（镜像）
  const rcp1x = cp2x - nx * widthTip  * 0.35;
  const rcp1y = cp2y - ny * widthTip  * 0.35;
  const rcp2x = cp1x - nx * widthBase * 0.35;
  const rcp2y = cp1y - ny * widthBase * 0.35;

  // 构建闭合路径
  ctx.beginPath();
  ctx.moveTo(p0x, p0y);
  ctx.bezierCurveTo(lcp1x, lcp1y, lcp2x, lcp2y, p1x, p1y);
  ctx.lineTo(p2x, p2y);
  ctx.bezierCurveTo(rcp1x, rcp1y, rcp2x, rcp2y, p3x, p3y);
  ctx.closePath();

  // 沿花瓣脊线方向的渐变
  const grad = ctx.createLinearGradient(pivotX, pivotY, tipX, tipY);

  // 解析颜色 → 带 alpha 版本
  grad.addColorStop(0.0, hexToRgba(colorB, 0));
  grad.addColorStop(0.1, hexToRgba(colorB, alpha * 0.6));
  grad.addColorStop(0.4, hexToRgba(colorA, alpha));
  grad.addColorStop(0.75, hexToRgba(colorA, alpha * 0.7));
  grad.addColorStop(1.0, hexToRgba(colorA, 0));

  ctx.globalCompositeOperation = blendMode;
  ctx.globalAlpha = brightness;
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.globalAlpha = 1;
}

// ─────────────────────────────────────────────
// 绘制背景
// ─────────────────────────────────────────────
function drawBackground(theme) {
  const W = canvas.width, H = canvas.height;
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  // 三角形插值背景渐变
  const [c1, c2, c3] = theme.bg;
  const bg = ctx.createRadialGradient(W * 0.5, H * 0.4, 0, W * 0.5, H * 0.5, W * 0.9);
  bg.addColorStop(0, c2);
  bg.addColorStop(0.5, c1);
  bg.addColorStop(1, c3);

  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
}

// ─────────────────────────────────────────────
// 颜色线性插值（用于过渡动画）
// ─────────────────────────────────────────────
function lerpColor(hexA, hexB, t) {
  const a = hexToRgb(hexA), b = hexToRgb(hexB);
  return rgbToHex(
    Math.round(a.r + (b.r - a.r) * t),
    Math.round(a.g + (b.g - a.g) * t),
    Math.round(a.b + (b.b - a.b) * t),
  );
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}

function rgbToHex(r,g,b) {
  return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
}

function hexToRgba(hex, alpha) {
  const {r,g,b} = hexToRgb(hex);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ─────────────────────────────────────────────
// 主题混合（过渡时在两套花瓣参数之间插值）
// ─────────────────────────────────────────────
function blendTheme(fromTheme, toTheme, progress) {
  const t = easeInOutCubic(progress);
  return {
    name:      toTheme.name,
    bg:        toTheme.bg.map((c,i) => lerpColor(fromTheme.bg[i], c, t)),
    petals:    toTheme.petals.map((p, i) => {
      const fp = fromTheme.petals[i % fromTheme.petals.length];
      return {
        colorA: lerpColor(fp.colorA, p.colorA, t),
        colorB: lerpColor(fp.colorB, p.colorB, t),
        alpha:  fp.alpha + (p.alpha - fp.alpha) * t,
        pivotX: fp.pivotX,
        pivotY: fp.pivotY,
      };
    }),
    blendMode:  toTheme.blendMode,
    petalCount: toTheme.petalCount,
    spread:     fromTheme.spread + (toTheme.spread - fromTheme.spread) * t,
    curvature:  fromTheme.curvature + (toTheme.curvature - fromTheme.curvature) * t,
    brightness: fromTheme.brightness + (toTheme.brightness - fromTheme.brightness) * t,
  };
}

function easeInOutCubic(x) {
  return x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x+2,3)/2;
}

// ─────────────────────────────────────────────
// Resize
// ─────────────────────────────────────────────
function resize() {
  canvas.width  = window.innerWidth  * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  canvas.style.width  = window.innerWidth  + 'px';
  canvas.style.height = window.innerHeight + 'px';
}

// ─────────────────────────────────────────────
// 主渲染循环
// ─────────────────────────────────────────────
function render() {
  requestAnimationFrame(render);
  time++;

  // 过渡进度
  if (transitionProgress < 1) {
    transitionProgress = Math.min(1, transitionProgress + 0.018);
  }

  // 计算当前显示的主题（插值混合）
  const fromTheme = THEMES[currentThemeIdx];
  const toTheme   = THEMES[targetThemeIdx];
  const displayTheme = transitionProgress >= 1
    ? toTheme
    : blendTheme(fromTheme, toTheme, transitionProgress);

  if (transitionProgress >= 1 && currentThemeIdx !== targetThemeIdx) {
    currentThemeIdx = targetThemeIdx;
  }

  // 生成当前帧的花瓣参数
  const petals = generatePetals(displayTheme, time);

  // ── 绘制 ──
  drawBackground(displayTheme);

  // 底部光晕（增强原图的"从底部涌出"感）
  drawBottomGlow(displayTheme);

  // 绘制所有花瓣
  petals.forEach(p => drawPetal(p, displayTheme.blendMode, displayTheme.brightness));

  // 顶部暗角遮罩（压暗边缘，聚焦中心）
  drawVignette();
}

// ─────────────────────────────────────────────
// 底部辉光
// ─────────────────────────────────────────────
function drawBottomGlow(theme) {
  const W = canvas.width, H = canvas.height;
  const mainColor = theme.petals[Math.floor(theme.petals.length / 2)].colorA;
  const glow = ctx.createRadialGradient(W*0.5, H*1.05, 0, W*0.5, H*1.05, W*0.45);
  glow.addColorStop(0,   hexToRgba(mainColor, 0.35));
  glow.addColorStop(0.5, hexToRgba(mainColor, 0.08));
  glow.addColorStop(1,   hexToRgba(mainColor, 0));
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = 1;
  ctx.fillStyle = glow;
  ctx.fillRect(0, H * 0.5, W, H * 0.6);
}

// ─────────────────────────────────────────────
// 暗角
// ─────────────────────────────────────────────
function drawVignette() {
  const W = canvas.width, H = canvas.height;
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  const v = ctx.createRadialGradient(W*0.5, H*0.5, H*0.1, W*0.5, H*0.5, H*0.85);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.65)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

// ─────────────────────────────────────────────
// Button 交互
// ─────────────────────────────────────────────
const buttons = document.querySelectorAll('.btn');
const indicator = document.getElementById('indicator');
const label = document.getElementById('label');

function updateIndicator(btn) {
  const group = document.getElementById('btnGroup');
  const groupRect = group.getBoundingClientRect();
  const btnRect = btn.getBoundingClientRect();
  indicator.style.left  = (btnRect.left - groupRect.left) + 'px';
  indicator.style.width = btnRect.width + 'px';

  // 指示器颜色随主题变化
  const colors = [
    'rgba(160,60,255,0.45)',
    'rgba(0,160,255,0.45)',
    'rgba(255,100,0,0.45)',
    'rgba(0,220,150,0.45)',
    'rgba(140,100,255,0.35)',
  ];
  indicator.style.background = colors[targetThemeIdx] || colors[0];
}

buttons.forEach(btn => {
  btn.addEventListener('click', () => {
    const idx = parseInt(btn.dataset.theme);
    if (idx === targetThemeIdx && transitionProgress >= 1) return;

    // 如果上一个过渡还没结束，从当前混合状态作为新起点
    if (transitionProgress < 1) {
      currentThemeIdx = targetThemeIdx; // 不完美但够用
    }

    targetThemeIdx = idx;
    transitionProgress = 0;

    buttons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    label.textContent = THEMES[idx].name;
    updateIndicator(btn);
  });
});

// 初始化 indicator 位置
window.addEventListener('load', () => {
  updateIndicator(buttons[0]);
});

window.addEventListener('resize', resize);
resize();
render();
</script>
</body>
</html>
