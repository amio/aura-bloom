<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流光背景</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<script>
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');

let W, H, cx, cy;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W * 0.42;   // 扇形收束点 X
  cy = H * 1.05;   // 扇形收束点 Y（稍微在屏幕下方）
}
resize();
window.addEventListener('resize', resize);

// ── 扇叶参数定义 ──────────────────────────────────────────
// 每条"光叶"由两条曲线边 + 一个渐变色定义
const PETALS = [
  // { angleL, angleR, color1, color2, alpha }
  { aL: -1.72, aR: -1.55, c1: '#0a0035', c2: '#1a0060', a: 1.0  },
  { aL: -1.55, aR: -1.32, c1: '#1a0060', c2: '#3d00a0', a: 0.9  },
  { aL: -1.32, aR: -1.05, c1: '#3d00a0', c2: '#7b00cc', a: 0.85 },
  { aL: -1.05, aR: -0.75, c1: '#7b00cc', c2: '#b800e6', a: 0.90 },
  { aL: -0.75, aR: -0.42, c1: '#b800e6', c2: '#e040fb', a: 0.95 },
  { aL: -0.42, aR: -0.08, c1: '#e040fb', c2: '#ff5cde', a: 1.0  },
  { aL: -0.08, aR:  0.22, c1: '#ff5cde', c2: '#ff3dac', a: 1.0  },
  { aL:  0.22, aR:  0.55, c1: '#ff3dac', c2: '#c4006e', a: 0.9  },
  { aL:  0.55, aR:  0.85, c1: '#c4006e', c2: '#5c0040', a: 0.8  },
];

// 曲线控制点偏移（让扇叶有弧度）
const CTRL_LIFT = 0.38; // 控制点上移比例

// ── 动画状态 ──────────────────────────────────────────────
let t = 0;

// 每条扇叶独立的动画相位
const phases = PETALS.map((_, i) => ({
  speed : 0.00018 + i * 0.000035,
  ampA  : 0.055 + Math.random() * 0.04,   // 角度振幅
  ampB  : 0.040 + Math.random() * 0.03,
  phaseA: Math.random() * Math.PI * 2,
  phaseB: Math.random() * Math.PI * 2,
  // 高亮流光
  glowSpeed : 0.0004 + Math.random() * 0.0003,
  glowPhase : Math.random() * Math.PI * 2,
}));

// ── 工具：沿角度方向上的远端点 ───────────────────────────
function farPoint(angle, dist) {
  return {
    x: cx + Math.cos(angle) * dist,
    y: cy + Math.sin(angle) * dist,
  };
}

// 二次贝塞尔控制点（让边缘有流畅弧度）
function ctrlPoint(angle, dist) {
  const liftAngle = angle - Math.PI / 2; // 垂直向上偏移
  return {
    x: cx + Math.cos(angle) * dist * 0.55 + Math.cos(liftAngle) * dist * CTRL_LIFT,
    y: cy + Math.sin(angle) * dist * 0.55 + Math.sin(liftAngle) * dist * CTRL_LIFT,
  };
}

// ── 绘制单个扇叶 ──────────────────────────────────────────
function drawPetal(p, ph, time) {
  const dist = Math.sqrt(W * W + H * H) * 1.1;

  // 动态角度扰动
  const dL = Math.sin(time * ph.speed * 6283 + ph.phaseA) * ph.ampA;
  const dR = Math.sin(time * ph.speed * 6283 + ph.phaseB) * ph.ampB;
  const aL  = p.aL + dL;
  const aR  = p.aR + dR;
  const aMid = (aL + aR) / 2;

  const pL  = farPoint(aL,   dist);
  const pR  = farPoint(aR,   dist);
  const cpL = ctrlPoint(aL,  dist);
  const cpR = ctrlPoint(aR,  dist);

  // 路径：从收束点出发，沿左边曲线到远端，横过去，沿右边曲线回来
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.quadraticCurveTo(cpL.x, cpL.y, pL.x, pL.y);
  // 远端弧线连接（让边缘自然）
  ctx.lineTo(pR.x, pR.y);
  ctx.quadraticCurveTo(cpR.x, cpR.y, cx, cy);
  ctx.closePath();

  // 渐变：从收束点 → 远端中心方向
  const midFar = farPoint(aMid, dist * 0.7);
  const grad = ctx.createLinearGradient(cx, cy, midFar.x, midFar.y);
  grad.addColorStop(0,   hexAlpha(p.c1, 0));
  grad.addColorStop(0.15, hexAlpha(p.c1, p.a * 0.6));
  grad.addColorStop(0.5,  hexAlpha(p.c2, p.a));
  grad.addColorStop(1,    hexAlpha(p.c2, p.a * 0.5));
  ctx.fillStyle = grad;
  ctx.fill();

  // ── 流光高亮：在扇叶内侧边缘叠加一条亮线 ──
  const glowT   = (Math.sin(time * ph.glowSpeed * 6283 + ph.glowPhase) + 1) / 2;
  const glowAng = aL + (aR - aL) * glowT;
  drawGlowLine(glowAng, dist, p.c2);
}

// ── 流光线条 ─────────────────────────────────────────────
function drawGlowLine(angle, dist, color) {
  const cp  = ctrlPoint(angle, dist);
  const fp  = farPoint(angle,  dist);
  const w   = 18; // 光晕宽度

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.quadraticCurveTo(cp.x, cp.y, fp.x, fp.y);

  const grad = ctx.createLinearGradient(cx, cy, fp.x, fp.y);
  grad.addColorStop(0,   'rgba(255,255,255,0)');
  grad.addColorStop(0.2, hexAlpha(color, 0.25));
  grad.addColorStop(0.6, 'rgba(255,255,255,0.55)');
  grad.addColorStop(1,   'rgba(255,255,255,0)');

  ctx.strokeStyle = grad;
  ctx.lineWidth   = w;
  ctx.lineCap     = 'round';

  // 柔化光晕
  ctx.shadowColor = color;
  ctx.shadowBlur  = 28;
  ctx.globalAlpha = 0.55;
  ctx.stroke();
  ctx.restore();
}

// ── 全局背景底色 ─────────────────────────────────────────
function drawBackground() {
  const bg = ctx.createRadialGradient(
    W * 0.65, H * 0.25, 0,
    W * 0.5,  H * 0.5,  Math.max(W, H) * 0.85
  );
  bg.addColorStop(0,   '#cc00aa');
  bg.addColorStop(0.3, '#7700cc');
  bg.addColorStop(0.65,'#2a0066');
  bg.addColorStop(1,   '#000010');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
}

// ── 顶部柔光晕（模拟图中右上角的粉红亮区） ──────────────
function drawTopGlow(time) {
  const pulse = 0.75 + 0.25 * Math.sin(time * 0.00031 * 6283);
  const gx = W * (0.72 + 0.08 * Math.sin(time * 0.00019 * 6283));
  const gy = H * (0.08 + 0.06 * Math.sin(time * 0.00023 * 6283));
  const gr = ctx.createRadialGradient(gx, gy, 0, gx, gy, W * 0.45);
  gr.addColorStop(0,   `rgba(255,80,200,${0.55 * pulse})`);
  gr.addColorStop(0.4, `rgba(200,0,180,${0.28 * pulse})`);
  gr.addColorStop(1,   'rgba(100,0,120,0)');
  ctx.fillStyle = gr;
  ctx.fillRect(0, 0, W, H);
}

// ── 底部暗角压色 ─────────────────────────────────────────
function drawVignette() {
  const vg = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, Math.max(W,H)*0.8);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.65)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

// ── 主循环 ───────────────────────────────────────────────
function render(timestamp) {
  t = timestamp / 1000; // 秒

  ctx.clearRect(0, 0, W, H);

  // 1. 底色
  drawBackground();

  // 2. 顶部粉光
  drawTopGlow(t);

  // 3. 扇叶（用叠加混合让颜色更通透）
  ctx.globalCompositeOperation = 'screen';
  PETALS.forEach((p, i) => drawPetal(p, phases[i], t));
  ctx.globalCompositeOperation = 'source-over';

  // 4. 暗角
  drawVignette();

  requestAnimationFrame(render);
}

// ── 工具：hex + alpha → rgba 字符串 ──────────────────────
function hexAlpha(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

requestAnimationFrame(render);
</script>
</body>
</html>
