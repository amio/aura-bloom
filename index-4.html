<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Canvas 光影背景</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b001a;}
  canvas{display:block;width:100%;height:100%;}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<script>
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
function resize(){
  canvas.width = innerWidth * devicePixelRatio;
  canvas.height = innerHeight * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
}
resize();
addEventListener('resize', resize);

const particles = Array.from({length:120}, ()=>({
  x: Math.random()*innerWidth,
  y: Math.random()*innerHeight,
  vx: (Math.random()-0.5)*0.4,
  vy: (Math.random()-0.5)*0.4,
  r: Math.random()*2+0.5,
  a: Math.random()*0.6+0.2
}));

let t=0;
function draw(){
  const w = innerWidth, h = innerHeight;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = "#0b001a";
  ctx.fillRect(0,0,w,h);

  const cx = w/2, cy = h*0.78;
  const petals = 7;

  for(let i=0;i<petals;i++){
    const base = -Math.PI/2 + (i-(petals-1)/2)*0.35;
    const sway = Math.sin(t*0.6 + i)*0.08;
    const angle = base + sway;
    const len = h*0.95;
    const spread = 0.55 + 0.08*Math.sin(t+i);

    const x1 = cx + Math.cos(angle-spread)*len*0.12;
    const y1 = cy + Math.sin(angle-spread)*len*0.12;
    const x2 = cx + Math.cos(angle)*len;
    const y2 = cy + Math.sin(angle)*len;
    const x3 = cx + Math.cos(angle+spread)*len*0.12;
    const y3 = cy + Math.sin(angle+spread)*len*0.12;

    const grad = ctx.createRadialGradient(cx,cy,20,x2,y2,len);
    grad.addColorStop(0,"rgba(255,120,255,0.85)");
    grad.addColorStop(0.5,"rgba(140,0,200,0.45)");
    grad.addColorStop(1,"rgba(40,0,80,0.05)");

    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.quadraticCurveTo(x1,y1,x2,y2);
    ctx.quadraticCurveTo(x3,y3,cx,cy);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.06)";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // 流光粒子
  for(const p of particles){
    p.x += p.vx; p.y += p.vy;
    if(p.x<0||p.x>w) p.vx*=-1;
    if(p.y<0||p.y>h) p.vy*=-1;
    ctx.beginPath();
    ctx.fillStyle = `rgba(255,255,255,${p.a})`;
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  }

  t += 0.01;
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
