<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Aura Bloom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, 'SF Pro Display', sans-serif; }
  canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }

  /* ── UI Shell ── */
  .ui { position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 24px; }

  /* Pattern pills */
  .pattern-row { display: flex; gap: 8px; background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.12); border-radius: 50px; padding: 6px; }
  .p-btn { position: relative; padding: 10px 22px; border: none; border-radius: 40px; cursor: pointer; font-size: 13px; font-weight: 500; letter-spacing: 0.3px; color: rgba(255,255,255,0.55); background: transparent; transition: color .3s ease; white-space: nowrap; }
  .p-btn::before { content: ''; position: absolute; inset: 0; border-radius: 40px; background: rgba(255,255,255,0.12); opacity: 0; transition: opacity .3s ease; }
  .p-btn:hover::before { opacity: 1; }
  .p-btn:hover { color: rgba(255,255,255,0.8); }
  .p-btn.active { color: #fff; }
  .p-btn.active::before { opacity: 1; background: rgba(255,255,255,0.18); }
  .p-indicator { position: absolute; top: 6px; height: calc(100% - 12px); border-radius: 40px; transition: left .4s cubic-bezier(.34,1.56,.64,1), width .4s cubic-bezier(.34,1.56,.64,1), background .6s ease; pointer-events: none; z-index: -1; }

  /* Theme dots */
  .theme-row { display: flex; gap: 10px; align-items: center; }
  .t-dot { width: 28px; height: 28px; border-radius: 50%; outline: 2px solid rgba(255,255,255,0.15); cursor: pointer; transition: transform .25s, border-color .25s; position: relative; }
  .t-dot:hover { transform: scale(1.15); }
  .t-dot.active { outline-color: rgba(255,255,255,0.7); transform: scale(1.18); }
  .t-dot::after { content:''; position:absolute; inset:3px; border-radius:50%; background: inherit; filter: brightness(1.4); }

  .label { color: rgba(255,255,255,0.22); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; user-select: none; }

  /* ── Screenshot overlay ── */
  .screenshot-overlay {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .screenshot-frame {
    position: relative;
    max-width: min(720px, 90vw);
    max-height: 85vh;
    line-height: 0;
    border-radius: 12px;
    overflow: hidden;
    box-shadow:
      0 0 0 0.5px rgba(0, 0, 0, 0.15),
      0 8px 16px rgba(0, 0, 0, 0.15),
      0 16px 48px rgba(0, 0, 0, 0.25);
  }
  .screenshot-blur-bg {
    position: absolute;
    inset: 0;
    backdrop-filter: blur(40px) saturate(1.6);
    -webkit-backdrop-filter: blur(10px) saturate(1.6);
    background: rgba(0, 0, 0, 0.35);
  }
  .screenshot-img {
    position: relative;
    z-index: 1;
    max-width: min(720px, 90vw);
    max-height: 85vh;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
    opacity: 0.75;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="screenshot-overlay">
  <div class="screenshot-frame">
    <div class="screenshot-blur-bg"></div>
    <img class="screenshot-img" src="naive-screenshot.png" alt="Screenshot" />
  </div>
</div>

<div class="ui">
  <div class="label" id="lbl">Monterey · Bloom</div>
  <div class="pattern-row" id="patRow">
    <div class="p-indicator" id="pInd"></div>
    <button class="p-btn active" data-p="0">Bloom</button>
    <button class="p-btn" data-p="1">Iris</button>
    <button class="p-btn" data-p="2">Spiral</button>
    <button class="p-btn" data-p="3">Crown</button>
    <button class="p-btn" data-p="4">Feather</button>
    <button class="p-btn" data-p="5">Vortex</button>
  </div>
  <div class="theme-row" id="themeRow"></div>
</div>

<script>
// ═══════════════════════════════════════════════
// THEMES — color palettes only
// ═══════════════════════════════════════════════
const THEMES = [
  { name:'Monterey',  bg:'#0a0018', colors:['#9b00ff','#ff00cc','#ff50dd','#dd00ff','#7700bb','#ff80ee'] },
  { name:'Ocean',     bg:'#000d1a', colors:['#00cfff','#0088ff','#00eeff','#44ffdd','#0055ff','#88eeff'] },
  { name:'Solar',     bg:'#0d0200', colors:['#ff6600','#ffaa00','#ff3300','#ffdd00','#ff0044','#ffcc44'] },
  { name:'Aurora',    bg:'#000d08', colors:['#00ff88','#00ddff','#88ffcc','#00ffcc','#44ddff','#aaffdd'] },
  { name:'Obsidian',  bg:'#060608', colors:['#8800ff','#ccccff','#aaaaff','#ffffff','#6600cc','#eeeeff'] },
  { name:'Crimson',   bg:'#0d0008', colors:['#ff0066','#cc0088','#ff44aa','#880044','#ff00aa','#dd4488'] },
  { name:'Gold',      bg:'#080600', colors:['#ffcc00','#ff9900','#ffee66','#cc8800','#ffbb33','#eedd88'] },
];

const THEME_DOT_COLORS = [
  'radial-gradient(circle at 40% 40%,#cc66ff,#440088)',
  'radial-gradient(circle at 40% 40%,#44ddff,#003388)',
  'radial-gradient(circle at 40% 40%,#ffaa44,#660000)',
  'radial-gradient(circle at 40% 40%,#44ffcc,#003322)',
  'radial-gradient(circle at 40% 40%,#9966ff,#111133)',
  'radial-gradient(circle at 40% 40%,#ff44aa,#330011)',
  'radial-gradient(circle at 40% 40%,#ffcc44,#332200)',
];

// ═══════════════════════════════════════════════
// PATTERNS — pure geometry generators
// Each returns an array of "blade" descriptors:
//   { cx, cy, angle, length, belly, tipSharp, baseWidth }
//   All in normalised [0‥1] space, Y-up
// ═══════════════════════════════════════════════
const PATTERNS = [

  // 0 · BLOOM — 花苞 (原图风格：扇形，中段饱满，顶部收拢)
  {
    name: 'Bloom',
    gen(n, W, H, t) {
      const blades = [];
      const cx = 0.5, cy = 1.08;
      for (let i = 0; i < n; i++) {
        const norm = i / (n - 1);
        const angle = (-0.52 + norm * 1.04) * Math.PI; // 左→右 扇形
        // 呼吸：每片独立晃动
        const breath = Math.sin(t * 0.00090 + norm * 3.1) * 0.075;
        const a = angle + breath;
        blades.push({
          cx, cy,
          angle: a,
          length: 1.18 + Math.cos(t * 0.00070 + norm * 2.2) * 0.15,
          belly: 0.42 + Math.sin(t * 0.00076 + norm * 2.5) * 0.17,
          tipSharp: 0.08,   // 顶部收拢比例
          baseWidth: 0.14 + (1 - Math.abs(norm - 0.5) * 2) * 0.06,
        });
      }
      return blades;
    },
  },

  // 1 · IRIS — 鸢尾：少量宽大花瓣，中间重叠
  {
    name: 'Iris',
    gen(n, W, H, t) {
      const blades = [];
      const count = Math.max(3, Math.floor(n * 0.65));
      const cx = 0.5, cy = 1.1;
      for (let i = 0; i < count; i++) {
        const norm = i / (count - 1);
        const angle = (-0.38 + norm * 0.76) * Math.PI;
        const breath = Math.sin(t * 0.0008 + norm * 2.4) * 0.088;
        const sway   = Math.cos(t * 0.00056 + i) * 0.058;
        blades.push({
          cx, cy,
          angle: angle + breath + sway,
          length: 1.22 + Math.sin(t * 0.00064 + norm * 1.8) * 0.14,
          belly: 0.58 + Math.cos(t * 0.00072 + norm * 2.2) * 0.17,
          tipSharp: 0.04,
          baseWidth: 0.21 - Math.abs(norm - 0.5) * 0.06,
        });
      }
      return blades;
    },
  },

  // 2 · SPIRAL — 螺旋：从底部扭转向上，角度不对称
  {
    name: 'Spiral',
    gen(n, W, H, t) {
      const blades = [];
      const cx = 0.5, cy = 1.1;
      for (let i = 0; i < n; i++) {
        const norm = i / (n - 1);
        // 螺旋偏移：让左侧花瓣偏右旋，右侧偏左旋
        const twist = (norm - 0.5) * 0.28;
        const angle = (-0.48 + norm * 0.96 + twist) * Math.PI;
        const breath = Math.sin(t * 0.0005 + norm * 4.2) * 0.014;
        const spin   = t * 0.00008; // 整体缓慢旋转
        blades.push({
          cx, cy,
          angle: angle + breath + spin,
          length: 1.10 + norm * 0.18,   // 右侧花瓣更长
          belly: 0.35 + norm * 0.15,
          tipSharp: 0.06,
          baseWidth: 0.10 + norm * 0.05,
        });
      }
      return blades;
    },
  },

  // 3 · CROWN — 皇冠：花瓣近乎垂直，顶部向外张开
  {
    name: 'Crown',
    gen(n, W, H, t) {
      const blades = [];
      const cx = 0.5, cy = 1.06;
      const count = n + 2;
      for (let i = 0; i < count; i++) {
        const norm = i / (count - 1);
        // 角度范围更宽，包含接近垂直的花瓣
        const angle = (-0.65 + norm * 1.30) * Math.PI;
        const breath = Math.sin(t * 0.00076 + norm * 2.8) * 0.078;
        const sway   = Math.cos(t * 0.00052 + norm * 1.6) * 0.038;
        // 顶部开放：belly 在中间最大，两侧收窄
        const belly = 0.50 - Math.abs(norm - 0.5) * 0.30 + Math.sin(t * 0.00084 + norm * 3.0) * 0.17;
        blades.push({
          cx, cy,
          angle: angle + breath + sway,
          length: 1.05 + Math.abs(norm - 0.5) * 0.20 + Math.cos(t * 0.00060 + norm * 2.0) * 0.12,
          belly,
          tipSharp: 0.12,   // 顶部比较尖
          baseWidth: 0.11 + (1 - Math.abs(norm - 0.5) * 2) * 0.04,
        });
      }
      return blades;
    },
  },

  // 4 · FEATHER — 羽毛：细长、飘逸，左右不对称
  {
    name: 'Feather',
    gen(n, W, H, t) {
      const blades = [];
      const cx = 0.5, cy = 1.12;
      for (let i = 0; i < n; i++) {
        const norm = i / (n - 1);
        // 非对称扇形：右侧花瓣更多、更密
        const angle = (-0.44 + norm * 1.05) * Math.PI;
        // 羽毛的"飘动"振幅更大
        const flutter = Math.sin(t * 0.0012 + norm * 5.5) * 0.105;
        const drift   = Math.cos(t * 0.00044 + norm * 1.8) * 0.050;
        blades.push({
          cx, cy,
          angle: angle + flutter + drift,
          length: 1.28 - Math.abs(norm - 0.5) * 0.3 + Math.sin(t * 0.00100 + norm * 4.0) * 0.13,
          belly: 0.22 + Math.sin(t * 0.00110 + norm * 3.5) * 0.13,
          tipSharp: 0.03,     // 顶部非常细
          baseWidth: 0.07 + (1 - Math.abs(norm - 0.5) * 2) * 0.04,
        });
      }
      return blades;
    },
  },

  // 5 · VORTEX — 漩涡：所有花瓣向同一方向扭曲
  {
    name: 'Vortex',
    gen(n, W, H, t) {
      const blades = [];
      const spin = t * 0.00012;
      for (let i = 0; i < n; i++) {
        const norm = i / (n - 1);
        // 基础角度偏左，然后统一顺时针旋转
        const base  = (-0.60 + norm * 1.20) * Math.PI;
        // 每片额外扭转（越靠右扭转越多）
        const extra = norm * 0.35;
        const breath = Math.sin(t * 0.00042 + norm * 3.6) * 0.018;
        const cx = 0.5 + Math.sin(spin) * 0.02;
        const cy = 1.08 - Math.cos(spin) * 0.01;
        blades.push({
          cx, cy,
          angle: base + extra + spin + breath,
          length: 1.15 + Math.sin(norm * Math.PI) * 0.12,
          belly: 0.38 + Math.sin(norm * Math.PI) * 0.12,
          tipSharp: 0.07,
          baseWidth: 0.11 + Math.sin(norm * Math.PI) * 0.05,
        });
      }
      return blades;
    },
  },
];

// ═══════════════════════════════════════════════
// ENGINE
// ═══════════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

let curPat = 0, curTheme = 0;
let time = 0;

// Transition state
let fromPat = 0, fromTheme = 0;
let toPat   = 0, toTheme   = 0;
let trans   = 1; // 1 = settled
const TRANS_SPEED = 0.022;

// ── Resize ──
function resize() {
  canvas.width  = window.innerWidth  * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  canvas.style.width  = window.innerWidth  + 'px';
  canvas.style.height = window.innerHeight + 'px';
}
window.addEventListener('resize', resize);
resize();

// ── Helpers ──
function hexToRgb(hex) {
  return {
    r: parseInt(hex.slice(1,3),16),
    g: parseInt(hex.slice(3,5),16),
    b: parseInt(hex.slice(5,7),16),
  };
}
function lerpC(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  return `rgb(${~~(A.r+(B.r-A.r)*t)},${~~(A.g+(B.g-A.g)*t)},${~~(A.b+(B.b-A.b)*t)})`;
}
function hexAlpha(hex, a) {
  const {r,g,b} = hexToRgb(hex);
  return `rgba(${r},${g},${b},${a})`;
}
function ease(x) { return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }

// ── Draw one blade (the KEY function) ──
// blade: { cx, cy, angle, length, belly, tipSharp, baseWidth }
// All coords normalised; W,H for conversion
function drawBlade(blade, colorA, colorB, alpha, W, H) {
  const { cx, cy, angle, length, belly, tipSharp, baseWidth } = blade;

  // Convert pivot to pixels
  const px = cx * W;
  const py = cy * H;

  // Direction vector (angle is measured from downward Y-axis, clockwise)
  const dx = Math.sin(angle);
  const dy = -Math.cos(angle);

  // Blade tip
  const L  = length * H * 0.95;
  const tx = px + dx * L;
  const ty = py + dy * L;

  // Normal (perpendicular) vector
  const nx = -dy;
  const ny =  dx;

  // Half-widths at base and tip
  // In portrait (H > W) the screen is tall-and-narrow, so using raw W would make
  // petals look razor-thin.  We compensate by blending W toward the geometric mean
  // √(W·H) when the aspect ratio becomes portrait — this keeps landscape identical
  // while giving portrait petals their proper fullness.
  const refW     = H > W ? Math.sqrt(W * H) : W;
  const halfBase = baseWidth * refW * 0.5;
  const halfTip  = halfBase  * tipSharp;

  // ─── The belly control points ───
  // We place the Bézier control points OUTWARD from the mid-spine
  // The belly factor pushes them sideways, creating the "swollen" middle
  const bellyDist = halfBase * (1 + belly * 3.5);

  // Mid-point along the spine (slightly below centre for asymmetric fullness)
  const midT  = 0.42;
  const midX  = px + dx * L * midT;
  const midY  = py + dy * L * midT;

  // LEFT side
  // base-left → (belly control L) → tip-left
  const bl_x = px + nx * halfBase,   bl_y = py + ny * halfBase;
  const tl_x = tx + nx * halfTip,    tl_y = ty + ny * halfTip;
  const cl_x = midX + nx * bellyDist, cl_y = midY + ny * bellyDist;

  // RIGHT side (mirror)
  const br_x = px - nx * halfBase,   br_y = py - ny * halfBase;
  const tr_x = tx - nx * halfTip,    tr_y = ty - ny * halfTip;
  const cr_x = midX - nx * bellyDist, cr_y = midY - ny * bellyDist;

  // ─── Build path ───
  ctx.beginPath();
  ctx.moveTo(bl_x, bl_y);
  // Left edge: base → belly-control → tip (quadratic for clean arc)
  ctx.quadraticCurveTo(cl_x, cl_y, tl_x, tl_y);
  // Tip across
  ctx.lineTo(tr_x, tr_y);
  // Right edge back: tip → belly-control → base
  ctx.quadraticCurveTo(cr_x, cr_y, br_x, br_y);
  ctx.closePath();

  // ─── Gradient along spine ───
  const grad = ctx.createLinearGradient(px, py, tx, ty);
  grad.addColorStop(0.00, hexAlpha(colorB, 0));
  grad.addColorStop(0.08, hexAlpha(colorB, alpha * 0.5));
  grad.addColorStop(0.30, hexAlpha(colorA, alpha));
  grad.addColorStop(0.65, hexAlpha(colorA, alpha * 0.85));
  grad.addColorStop(0.88, hexAlpha(colorA, alpha * 0.40));
  grad.addColorStop(1.00, hexAlpha(colorA, 0));

  ctx.globalCompositeOperation = 'screen';
  ctx.fillStyle = grad;
  ctx.fill();

  // ─── Edge highlight — razor-thin silver rim light ───
  const hGrad = ctx.createLinearGradient(px, py, tx, ty);
  hGrad.addColorStop(0.00, 'rgba(255,255,255,0)');
  hGrad.addColorStop(0.10, `rgba(255,255,255,${alpha * 0.35})`);
  hGrad.addColorStop(0.45, `rgba(255,255,255,${alpha * 0.50})`);
  hGrad.addColorStop(0.80, `rgba(255,255,255,${alpha * 0.25})`);
  hGrad.addColorStop(1.00, 'rgba(255,255,255,0)');

  ctx.beginPath();
  ctx.moveTo(bl_x, bl_y);
  ctx.quadraticCurveTo(cl_x, cl_y, tl_x, tl_y);

  ctx.globalCompositeOperation = 'screen';
  ctx.strokeStyle = hGrad;
  ctx.lineWidth = 1.2 * devicePixelRatio;
  ctx.lineCap = 'round';
  ctx.stroke();
}

// ── Draw full scene ──
function drawScene(patIdx, themeIdx, W, H) {
  const theme   = THEMES[themeIdx];
  const pattern = PATTERNS[patIdx];
  const n       = 8; // blade count fed to generator

  const blades = pattern.gen(n, W, H, time);

  blades.forEach((blade, i) => {
    const ci = i % theme.colors.length;
    const colorA = theme.colors[ci];
    const colorB = theme.colors[(ci + 2) % theme.colors.length];
    // Alpha varies: centre blades slightly brighter
    const norm  = i / (blades.length - 1);
    const alpha = 0.65 + Math.sin(norm * Math.PI) * 0.25;
    drawBlade(blade, colorA, colorB, alpha, W, H);
  });
}

// ── Background ──
function drawBg(themeIdx, alpha = 1) {
  const W = canvas.width, H = canvas.height;
  const bg = THEMES[themeIdx].bg;
  const {r,g,b} = hexToRgb(bg);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = alpha;
  ctx.fillStyle = `rgb(${r},${g},${b})`;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;

  // Ambient radial
  const main = THEMES[themeIdx].colors[1];
  const rad = ctx.createRadialGradient(W*.5,H*.9,0, W*.5,H*.9, W*.6);
  rad.addColorStop(0, hexAlpha(main, 0.18 * alpha));
  rad.addColorStop(1, hexAlpha(main, 0));
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = 1;
  ctx.fillStyle = rad;
  ctx.fillRect(0, 0, W, H);
}

// ── Vignette ──
function drawVignette() {
  const W = canvas.width, H = canvas.height;
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  const v = ctx.createRadialGradient(W*.5,H*.42,H*.05, W*.5,H*.52,H*.78);
  v.addColorStop(0,'rgba(0,0,0,0)');
  v.addColorStop(1,'rgba(0,0,0,0.72)');
  ctx.fillStyle = v;
  ctx.fillRect(0,0,W,H);
}

// ── Main loop ──
function render() {
  requestAnimationFrame(render);
  time += 3;

  const W = canvas.width, H = canvas.height;

  if (trans < 1) trans = Math.min(1, trans + TRANS_SPEED);
  const t = ease(trans);

  // Background
  if (trans < 1) {
    drawBg(fromTheme, 1);
    drawBg(toTheme,   t);
  } else {
    drawBg(curTheme);
  }

  // Blades
  ctx.globalAlpha = 1;
  if (trans < 1) {
    ctx.globalAlpha = 1 - t;
    drawScene(fromPat, fromTheme, W, H);
    ctx.globalAlpha = t;
    drawScene(toPat,   toTheme,   W, H);
    ctx.globalAlpha = 1;
  } else {
    drawScene(curPat, curTheme, W, H);
  }

  drawVignette();
}

// ═══════════════════════════════════════════════
// UI — build & wire up
// ═══════════════════════════════════════════════

// Build theme dots
const themeRow = document.getElementById('themeRow');
THEMES.forEach((th, i) => {
  const d = document.createElement('div');
  d.className = 't-dot' + (i===0?' active':'');
  d.title = th.name;
  d.style.background = THEME_DOT_COLORS[i];
  d.addEventListener('click', () => switchTheme(i));
  themeRow.appendChild(d);
});

// Pattern buttons indicator
const patRow = document.getElementById('patRow');
const pInd   = document.getElementById('pInd');

function moveIndicator(btn) {
  const rowR = patRow.getBoundingClientRect();
  const btnR = btn.getBoundingClientRect();
  pInd.style.left  = (btnR.left - rowR.left) + 'px';
  pInd.style.width = btnR.width + 'px';

  const indicatorColors = [
    hexAlpha(THEMES[curTheme].colors[0], 0.35),
    hexAlpha(THEMES[curTheme].colors[1], 0.35),
    hexAlpha(THEMES[curTheme].colors[2], 0.35),
  ];
  pInd.style.background = indicatorColors[curPat % indicatorColors.length];
}

function switchPattern(idx) {
  if (idx === curPat && trans >= 1) return;
  fromPat   = curPat;
  fromTheme = curTheme;
  toPat     = idx;
  toTheme   = curTheme;
  curPat    = idx;
  trans     = 0;

  document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`[data-p="${idx}"]`);
  btn.classList.add('active');
  moveIndicator(btn);
  updateLabel();
}

function switchTheme(idx) {
  if (idx === curTheme && trans >= 1) return;
  fromPat   = curPat;
  fromTheme = curTheme;
  toPat     = curPat;
  toTheme   = idx;
  curTheme  = idx;
  trans     = 0;

  document.querySelectorAll('.t-dot').forEach(d => d.classList.remove('active'));
  themeRow.children[idx].classList.add('active');
  updateLabel();
  moveIndicator(document.querySelector('.p-btn.active'));
}

function updateLabel() {
  document.getElementById('lbl').textContent =
    `${THEMES[curTheme].name} · ${PATTERNS[curPat].name}`;
}

document.querySelectorAll('.p-btn').forEach(btn => {
  btn.addEventListener('click', () => switchPattern(+btn.dataset.p));
});

window.addEventListener('load', () => {
  moveIndicator(document.querySelector('.p-btn.active'));
});

render();
</script>
</body>
</html>
